; Ustawienia programu Shank po polsku. Zmiany dzialaja od nastepnego uruchomienia gry.
[ustawienia]
; lektor = polski lektor (nagrania; gdy nagrania brak, czyta czytnik ekranu)
; napisy = polskie tlumaczenie czyta czytnik ekranu (NVDA, JAWS, Narrator)
; wylaczone = program nic nie robi
tryb=lektor
; 1 = audiodeskrypcja (drugi glos opisuje, co widac w scenkach), 0 = tylko lektor
audiodeskrypcja=1
; glosnosc dzwieku gry, gdy mowi lektor, w procentach
glosnosc_gry_pod_lektorem=35
; 1 = skrot "Shank po polsku" sam uruchamia gre, 0 = nie
uruchom_gre=1
; folder gry; puste = gra ze Steam. Dla innej kopii (np. GOG) wpisz folder gry albo folder z plikiem Shank.exe
folder_gry=
